services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    restart: always
    environment:
      MYSQL_WP_DATABASE: ${MYSQL_WP_DATABASE}
      MYSQL_WP_USER: ${MYSQL_WP_USER}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_WP_PASSWORD_FILE: /run/secrets/mysql_wp_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-e", "USE wp_database;"]
      interval: 3s
      timeout: 2s
      retries: 10
    secrets:
      - mysql_root_password
      - mysql_wp_password

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    restart: always
    volumes:
      - wp_data:/var/www/wp_site
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cgi-fcgi", "-bind", "-connect", "localhost:9000"]
      interval: 3s
      timeout: 2s
      retries: 10

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - wp_data:/var/www/wp_site

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_wp_password:
    file: ../secrets/mysql_wp_password.txt

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/thmaitre--/data/mariadb_volume

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/thmaitre--/data/wp_volume
