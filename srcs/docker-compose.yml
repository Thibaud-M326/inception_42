services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_WP_DATABASE: wp_database
      MYSQL_WP_USER: wp_user
      MYSQL_WP_PASSWORD_FILE: /run/secrets/mysql_wp_password
    secrets:
      - mysql_root_password
      - mysql_wp_password

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_wp_password:
    file: ../secrets/mysql_wp_password.txt

