services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_WP_DATABASE: wp_database
      MYSQL_WP_USER: wp_user
      MYSQL_WP_PASSWORD_FILE: /run/secrets/mysql_wp_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-e", "USE wp_database;"]
      interval: 5s
      timeout: 3s
      retries: 10
    secrets:
      - mysql_root_password
      - mysql_wp_password

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    volumes:
      - wp_data:/var/www/wp_site
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    volumes:
      - wp_data:/var/www/wp_site

secrets:
  mysql_root_password:
    file: ../secrets/mysql_root_password.txt
  mysql_wp_password:
    file: ../secrets/mysql_wp_password.txt

volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/thmaitre/data/mariadb

  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/thmaitre/data/wp
